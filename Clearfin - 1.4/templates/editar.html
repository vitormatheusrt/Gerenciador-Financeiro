{% extends 'base.html' %}

{% block content %}
<div class="edit-wrapper">
    <div class="edit-card">
        <h2 class="edit-title">Editar Transação</h2>
        
        <form action="{{ url_for('editar', id=transacao.id) }}" method="POST" class="edit-form">
            <div class="form-group">
                <label>Descrição</label>
                <input type="text" name="descricao" value="{{ transacao.descricao }}" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Valor (R$)</label>
                    <input type="number" step="0.01" name="valor" value="{{ transacao.valor }}" required>
                </div>
                <div class="form-group">
                    <label>Data de Vencimento</label>
                    <input type="date" name="data_vencimento" value="{{ transacao.data_vencimento }}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Categoria</label>
                    <input type="text" name="categoria" value="{{ transacao.categoria }}">
                </div>
                <div class="form-group">
                    <label>Forma de Pagamento</label>
                    <input type="text" name="forma_pagamento" value="{{ transacao.forma_pagamento }}">
                </div>
            </div>

            <div class="form-group-checkbox">
                <label class="checkbox-label">
                    <input type="checkbox" name="pago" {% if transacao.pago == 1 %}checked{% endif %}>
                    <span>Marcar como Pago / Recebido</span>
                </label>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn-save">Salvar Alterações</button>
                <a href="{{ url_for('index', aba='extrato') }}" class="btn-cancel">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<style>
.edit-wrapper {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.edit-card {
    background: #121824;
    border: 1px solid #1f293d;
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 500px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}
.edit-title {
    color: #fff;
    font-size: 22px;
    margin-bottom: 24px;
    text-align: center;
}
.edit-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
}
.form-row {
    display: flex;
    gap: 12px;
}
.form-row .form-group {
    flex: 1;
}
.form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.form-group label {
    font-size: 13px;
    color: #a0a7b8;
}
.form-group input[type="text"],
.form-group input[type="number"],
.form-group input[type="date"] {
    background: #0b0f19;
    border: 1px solid #2a3447;
    border-radius: 8px;
    padding: 10px 12px;
    color: #fff;
    font-size: 14px;
    outline: none;
}
.form-group input:focus {
    border-color: #3b82f6;
}
.form-group-checkbox {
    margin-top: 4px;
}
.checkbox-label {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
}
.btn-group {
    display: flex;
    gap: 10px;
    margin-top: 12px;
}
.btn-save {
    flex: 1;
    background: #3b82f6;
    color: #fff;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
}
.btn-cancel {
    flex: 1;
    background: #2a3447;
    color: #fff;
    text-decoration: none;
    text-align: center;
    padding: 12px;
    border-radius: 8px;
    font-weight: 600;
}
</style>
{% endblock %}
