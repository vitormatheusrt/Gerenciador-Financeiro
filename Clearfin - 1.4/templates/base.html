<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClearFin - Gestão Financeira</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <!-- Navbar Estilo SaaS Moderno (Inspiração: Vercel / Stripe / Linear) -->
    <style>
        .header-navbar {
            background-color: #0b0f19;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
        }

        .navbar-container {
            max-width: 1280px;
            margin: 0 auto;
            height: 64px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Logotipo com Ícone Vetorial */
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.2rem;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .brand-icon-wrapper {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
        }

        .brand-icon-wrapper svg {
            width: 18px;
            height: 18px;
            color: #ffffff;
        }

        .brand-logo .accent {
            color: #3b82f6;
        }

        /* Menu de Navegação Limpo */
        .nav-menu {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .nav-link-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            color: #94a3b8;
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .nav-link-item svg {
            width: 16px;
            height: 16px;
            stroke-width: 2;
            opacity: 0.7;
            transition: all 0.15s ease;
        }

        .nav-link-item:hover {
            color: #f8fafc;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .nav-link-item:hover svg {
            opacity: 1;
        }

        /* Estado Ativo Suave */
        .nav-link-item.active {
            color: #ffffff;
            background-color: rgba(59, 130, 246, 0.12);
            font-weight: 600;
        }

        .nav-link-item.active svg {
            color: #3b82f6;
            opacity: 1;
        }

        /* Botão Sair minimalista */
        .btn-logout-custom {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #94a3b8;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .btn-logout-custom svg {
            width: 15px;
            height: 15px;
            stroke-width: 2;
        }

        .btn-logout-custom:hover {
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.3);
            background: rgba(248, 113, 113, 0.08);
        }

        @media (max-width: 640px) {
            .navbar-container {
                padding: 0 16px;
            }
            .nav-link-item span.nav-text {
                display: none;
            }
            .nav-link-item {
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body>
    <header class="header-navbar">
        <div class="navbar-container">
            <!-- Logotipo -->
            <a href="{{ url_for('index') }}" class="brand-logo">
                <div class="brand-icon-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                        <line x1="2" y1="10" x2="22" y2="10"></line>
                    </svg>
                </div>
                <div>Clear<span class="accent">Fin</span></div>
            </a>

            {% if session.get('usuario_id') %}
            <!-- Links Centrais -->
            <nav class="nav-menu">
                <a href="{{ url_for('index', aba='dashboard') }}" class="nav-link-item {% if not aba_ativa or aba_ativa == 'dashboard' or aba_ativa == 'painel' %}active{% endif %}">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span class="nav-text">Painel</span>
                </a>

                <a href="{{ url_for('index', aba='novo') }}" class="nav-link-item {% if aba_ativa in ['novo', 'entrada', 'saida'] %}active{% endif %}">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="16"></line>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                    <span class="nav-text">Novo</span>
                </a>

                <a href="{{ url_for('index', aba='extrato') }}" class="nav-link-item {% if aba_ativa == 'extrato' %}active{% endif %}">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    <span class="nav-text">Extrato</span>
                </a>
            </nav>

            <!-- Ações do Usuário -->
            <div class="nav-user-actions">
                <a href="{{ url_for('logout') }}" class="btn-logout-custom">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Sair</span>
                </a>
            </div>
            {% endif %}
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
